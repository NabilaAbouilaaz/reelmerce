# Render Blueprint - https://render.com/docs/blueprint-spec
# In Render: New + -> Blueprint -> pick this repo. It creates the service below,
# then fill in the env vars marked "sync: false" in the dashboard.
services:
  - type: web
    name: reelmerce-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FAL_KEY
        sync: false
